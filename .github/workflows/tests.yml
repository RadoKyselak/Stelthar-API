name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest==7.4.3 pytest-asyncio==0.21.1 pytest-cov==4.1.0 pytest-mock==3.12.0
      # No secrets: every test runs against recorded payloads or fakes, and no
      # test may reach a paid API.
      - name: Test
        env:
          ANTHROPIC_API_KEY: ""
          AI_SEARCH_PROVIDER: "off"
        run: python -m pytest tests/ -q -p no:cacheprovider --no-cov
      - name: Extension syntax
        working-directory: extension
        run: for f in *.js; do node --check "$f"; done
      - name: Web page syntax
        working-directory: backend/static
        run: for f in *.js; do node --check "$f"; done
