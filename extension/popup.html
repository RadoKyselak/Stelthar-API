<!DOCTYPE html>
<html lang="en">
<head>
  <title>Project Mirador</title>
  <meta charset="UTF-8">
  <style>
    :root { --bg:#ffffff; --ink:#1d1d1f; --ink2:#6e6e73; --ink3:#86868b; --field:rgba(0,0,0,.05);
      --line:rgba(0,0,0,.1); --hover:rgba(0,0,0,.04); --focus:#0071e3; color-scheme: light dark;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1e1e20; --ink:#f5f5f7; --ink2:#a1a1a6; --ink3:#7c7c80; --field:rgba(255,255,255,.08);
        --line:rgba(255,255,255,.14); --hover:rgba(255,255,255,.06); --focus:#2997ff; }
    }
    * { box-sizing: border-box; }
    body { width: 360px; margin: 0; padding: 12px; background: var(--bg); color: var(--ink);
      font: 14px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    .field { display:flex; align-items:flex-start; gap:8px; background:var(--field); border-radius:10px;
      padding:8px 10px; transition: box-shadow .15s; }
    .field:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 35%, transparent); }
    .field svg { flex:none; width:16px; height:16px; margin-top:2px; color:var(--ink3); }
    textarea { flex:1; min-width:0; border:0; background:none; color:var(--ink); font:15px/1.35 var(--font);
      padding:0; resize:none; height:20px; max-height:110px; outline:none; }
    textarea::placeholder { color: var(--ink3); }
    .hint { height:18px; margin:6px 2px 0; font-size:11.5px; color:var(--ink3); }
    .hint kbd { font: inherit; }

    #out { margin-top: 4px; padding: 4px 2px 2px; }
    #out:empty { display:none; }
    #out > .mv { animation: in .16s ease-out; }
    @keyframes in { from { transform: translateY(3px); } to { transform:none; } }
    @media (prefers-reduced-motion: reduce) { #out > .mv { animation:none; } }

    .list h2 { margin: 10px 2px 4px; font-size: 11.5px; font-weight: 600; color: var(--ink3); }
    .list ul { list-style:none; margin:0; padding:0; }
    .list li button { width:100%; display:flex; align-items:center; gap:9px; text-align:left; border:0;
      background:none; color:var(--ink); font:13.5px/1.3 var(--font); padding:7px 6px; border-radius:7px; cursor:pointer; }
    .list li button:hover, .list li button:focus-visible { background: var(--hover); outline:none; }
    .list li span.t { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .dot { width:7px; height:7px; border-radius:50%; flex:none; background:#98989d; }
    .dot.supported { background:#28cd41; } .dot.mostly-accurate { background:#a3b800; }
    .dot.contradicted { background:#ff3b30; } .dot.misleading { background:#ff9500; }
    .dot.example { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink3); }
  </style>
</head>
<body>
  <form id="form" class="field" autocomplete="off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg>
    <label for="q" hidden>Check a claim or find a number</label>
    <textarea id="q" rows="1" spellcheck="false" placeholder="Check a claim or find a number"></textarea>
  </form>
  <div class="hint" id="hint" aria-live="polite"></div>
  <div id="out" aria-live="polite"></div>
  <section class="list" id="list" hidden>
    <h2 id="list-title"></h2>
    <ul id="items"></ul>
  </section>

  <script src="result-view.js"></script>
  <script src="popup.js"></script>
</body>
</html>
