<!DOCTYPE html>
<html lang="en">
<head>
  <title>Project Mirador</title>
  <meta charset="UTF-8">
  <style>
    :root { --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --field:#d1d5db; --bg:#ffffff; --subtle:#f9fafb;
      --accent:#2563eb; --accent-hover:#1d4ed8; --focus:#2563eb; color-scheme: light dark;
      --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#f3f4f6; --muted:#9ca3af; --line:#2b2f36; --field:#3a3f47; --bg:#17181b; --subtle:#1d1f23;
        --accent:#3b82f6; --accent-hover:#60a5fa; --focus:#60a5fa; }
    }
    * { box-sizing: border-box; }
    body { width: 380px; margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
      font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    label { display:block; font-weight:600; font-size:13px; margin-bottom: 6px; }
    .row { display:flex; gap:8px; align-items:flex-start; }
    textarea { flex:1; min-width:0; margin:0; border:1px solid var(--field); border-radius:8px;
      background: var(--bg); color: var(--ink); font: 14px/1.4 var(--font); padding: 9px 11px; resize: none;
      height: 40px; max-height: 120px; transition: border-color .12s, box-shadow .12s; }
    textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
    textarea::placeholder { color: var(--muted); }
    button.go { flex:none; height:40px; border:0; border-radius:8px; background: var(--accent); color: #fff;
      font: 600 13px var(--font); padding: 0 14px; cursor: pointer; }
    button.go:hover { background: var(--accent-hover); }
    .hint { margin: 6px 0 0; font-size:12px; color: var(--muted); }

    #out { margin-top: 16px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; }
    #out:empty { display: none; }

    .recent h2 { margin: 18px 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .recent ul { margin: 0; padding: 0; list-style: none; }
    .recent li button { display:flex; gap:9px; align-items:baseline; width:100%; text-align:left; border:0;
      background:none; padding:7px 8px; margin: 0 -8px; width: calc(100% + 16px); border-radius:8px; cursor:pointer;
      font: 13.5px/1.4 var(--font); color: var(--ink); }
    .recent li button:hover { background: var(--subtle); }
    .recent .t { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
    .recent .v { flex:none; font-size:12px; color: var(--muted); }
    .fine { margin: 16px 0 0; font-size: 11.5px; color: var(--muted); }
  </style>
</head>
<body>
  <form id="form" autocomplete="off" role="search">
    <label for="q">Check a claim or find a figure</label>
    <div class="row">
      <textarea id="q" rows="1" spellcheck="false" aria-describedby="q-hint"
        placeholder="e.g. Inflation was 9.1% in June 2022"></textarea>
      <button class="go" type="submit">Check</button>
    </div>
  </form>

  <div id="out" aria-live="polite"></div>

  <section class="recent" id="recent" hidden>
    <h2>Recent</h2>
    <ul id="items"></ul>
  </section>

  <p class="fine" id="q-hint">Checked against data from BLS, BEA, the Census Bureau, the Treasury and the
    Federal Reserve. Independent; not a government service.</p>

  <script src="result-view.js"></script>
  <script src="popup.js"></script>
</body>
</html>
