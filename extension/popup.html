<!DOCTYPE html>
<html lang="en">
<head>
  <title>Project Mirador</title>
  <meta charset="UTF-8">
  <style>
    :root { --bg:#fafaf9; --card:#ffffff; --ink:#121314; --muted:#6b6f76; --faint:#9a9ea5; --line:#e9e9e6;
      --focus:#2563eb;
      --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color-scheme: light dark; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0e0f10; --card:#161718; --ink:#f1f1f0; --muted:#a3a7ae; --faint:#71757c; --line:#2a2b2e; --focus:#8ab4ff; }
    }
    * { box-sizing: border-box; }
    body { width: 380px; margin: 0; padding: 14px 16px 16px; background: var(--bg); color: var(--ink);
      font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .top { display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; }
    .brand { display:flex; align-items:center; gap:9px; font-weight: 750; font-size: 15px; letter-spacing: -0.01em; }
    .brand img { width: 26px; height: 26px; border-radius: 7px; display:block; }
    .web { font-size: 12.5px; color: var(--muted); text-decoration: none; }
    .web:hover { color: var(--ink); }
    .modes { display:inline-flex; gap:2px; padding:3px; border-radius:999px; background:var(--card);
      border:1px solid var(--line); margin-bottom: 10px; }
    .mode { font: 600 12.5px var(--sans); color: var(--muted); background:none; border:0; border-radius:999px;
      padding: 5px 12px; cursor:pointer; }
    .mode[aria-selected="true"] { background: var(--ink); color: var(--card); }
    .ask { display:flex; align-items:flex-end; gap:6px; background:var(--card); border:1.5px solid var(--line);
      border-radius:14px; padding:5px 5px 5px 13px; }
    .ask:focus-within { border-color: var(--ink); }
    textarea { flex:1; min-width:0; border:0; background:none; color:var(--ink); font: 15px/1.4 var(--sans);
      padding: 8px 0; resize:none; height: 38px; max-height: 120px; }
    textarea:focus { outline:none; }
    textarea::placeholder { color: var(--faint); }
    #go { flex:none; width:38px; height:38px; border-radius:10px; border:0; background:var(--ink); color:var(--card);
      cursor:pointer; display:grid; place-items:center; }
    #go:disabled { opacity:.35; cursor:default; }
    #go svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .row { display:flex; justify-content:space-between; align-items:center; margin-top: 8px; }
    .surprise { display:inline-flex; align-items:center; gap:6px; font: 600 12.5px var(--sans); color:var(--muted);
      background:none; border:0; padding:2px; cursor:pointer; }
    .surprise:hover { color: var(--ink); }
    .surprise svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; }
    .surprise svg circle { fill: currentColor; stroke: none; }
    .count { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
    .count.over { color: #c4281c; font-weight: 600; }
    #out { margin-top: 12px; }
    #out:empty { display:none; }
    #out > .mv { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
    #out .mv-single .mv-n.mv-official { font-size: 34px; }
    details.recent { margin-top: 12px; }
    details.recent summary { cursor:pointer; list-style:none; font-size:12.5px; font-weight:600; color:var(--muted); }
    details.recent summary::-webkit-details-marker { display:none; }
    details.recent summary::after { content:" +"; color:var(--faint); }
    details.recent[open] summary::after { content:" \2212"; }
    #history { list-style:none; margin:6px 0 0; padding:0; }
    #history li { display:flex; gap:8px; align-items:baseline; padding:6px 4px; border-radius:8px; cursor:pointer; }
    #history li:hover { background: var(--card); }
    .dot { width:8px; height:8px; border-radius:50%; flex:none; background:#9aa1ab; transform: translateY(-1px); }
    .dot.supported { background:#12813a; } .dot.mostly-accurate { background:#8aa800; }
    .dot.contradicted { background:#c4281c; } .dot.misleading { background:#d97706; }
    .hclaim { min-width:0; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icons/icon48.png" alt="">Mirador</div>
    <a class="web" href="https://stelthar-api.vercel.app/" target="_blank" rel="noopener">Web app ↗</a>
  </header>

  <div class="modes" role="tablist" aria-label="Mode">
    <button class="mode" role="tab" id="mode-check" aria-selected="true">Check a claim</button>
    <button class="mode" role="tab" id="mode-find" aria-selected="false">Find a number</button>
  </div>

  <form id="form" class="ask" autocomplete="off">
    <label for="q" hidden id="q-label">Claim to check</label>
    <textarea id="q" rows="1" spellcheck="false" placeholder="Paste or type a claim with a number"></textarea>
    <button id="go" type="submit" aria-label="Check">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <div class="row">
    <button type="button" id="surprise" class="surprise">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r="1.2"/><circle cx="15" cy="15" r="1.2"/><circle cx="15" cy="9" r="1.2"/><circle cx="9" cy="15" r="1.2"/></svg>
      Surprise me
    </button>
    <span id="count" class="count"></span>
  </div>

  <div id="out" aria-live="polite"></div>

  <details class="recent" id="recent" hidden>
    <summary>Recent checks</summary>
    <ul id="history"></ul>
  </details>

  <script src="result-view.js"></script>
  <script src="popup.js"></script>
</body>
</html>
