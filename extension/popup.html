<!DOCTYPE html>
<html lang="en">
<head>
  <title>Project Mirador</title>
  <meta charset="UTF-8">
  <style>
    :root { --ink:#1b1b1b; --muted:#565c65; --line:#dfe1e2; --border:#565c65; --bg:#ffffff; --link:#005ea2;
      --btn:#005ea2; --btn-hover:#1a4480; --btn-ink:#ffffff; --focus:#2491ff; color-scheme: light dark;
      --font: "Public Sans", "Source Sans Pro", "Helvetica Neue", Helvetica, Roboto, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#f0f0f0; --muted:#a9aeb1; --line:#565c65; --border:#a9aeb1; --bg:#1b1b1b; --link:#73b3e7;
        --btn:#73b3e7; --btn-hover:#a8d3f5; --btn-ink:#1b1b1b; }
    }
    * { box-sizing: border-box; }
    body { width: 380px; margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
      font: 15px/1.5 var(--font); }
    :focus { outline: 4px solid var(--focus); outline-offset: 0; }
    :focus:not(:focus-visible) { outline: none; }

    label { display:block; font-weight:700; font-size:15px; }
    .hint { margin: 2px 0 6px; font-size:14px; color: var(--muted); }
    form { display:flex; align-items:stretch; }
    textarea { flex:1; min-width:0; margin:0; border:1px solid var(--border); border-right:0; border-radius:0;
      background: var(--bg); color: var(--ink); font: 15px/1.4 var(--font); padding: 8px 10px; resize: none;
      height: 40px; max-height: 120px; }
    button.go { flex:none; border:0; border-radius:0 4px 4px 0; background: var(--btn); color: var(--btn-ink);
      font: 700 15px var(--font); padding: 0 16px; cursor: pointer; }
    button.go:hover { background: var(--btn-hover); }

    #out { margin-top: 16px; }
    #out:empty { display: none; }

    .recent h2 { margin: 18px 0 6px; font-size: 15px; font-weight: 700; }
    .recent ul { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
    .recent li { border-bottom: 1px solid var(--line); padding: 7px 0; }
    .recent button { display:block; width:100%; text-align:left; border:0; background:none; padding:0; cursor:pointer;
      font: 15px/1.4 var(--font); color: var(--link); text-decoration: underline; }
    .recent span { display:block; font-size: 14px; color: var(--muted); }
    .fine { margin: 16px 0 0; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <form id="form" autocomplete="off" role="search">
    <div style="flex:1;min-width:0">
      <label for="q">Check a claim or find a figure</label>
      <p class="hint" id="q-hint">For example: Inflation was 9.1% in June 2022</p>
      <div style="display:flex">
        <textarea id="q" rows="1" spellcheck="false" aria-describedby="q-hint"></textarea>
        <button class="go" type="submit">Check</button>
      </div>
    </div>
  </form>

  <div id="out" aria-live="polite"></div>

  <section class="recent" id="recent" hidden>
    <h2>Recent checks</h2>
    <ul id="items"></ul>
  </section>

  <p class="fine">Figures come from the Bureau of Labor Statistics, Bureau of Economic Analysis,
    Census Bureau and Treasury. Project Mirador is independent and is not a government service.</p>

  <script src="result-view.js"></script>
  <script src="popup.js"></script>
</body>
</html>
