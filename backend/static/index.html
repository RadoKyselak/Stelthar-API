<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check a claim or find a number</title>
  <meta name="description" content="Check a claim or find a number in official U.S. government data, with the exact source.">
  <link rel="icon" href="/static/favicon.png" type="image/png">
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  <section class="hero">
    <div class="inner">
      <div class="modes" role="tablist" aria-label="Mode">
        <button type="button" role="tab" class="tab" id="mode-check" aria-selected="true">Check a claim</button>
        <button type="button" role="tab" class="tab" id="mode-find" aria-selected="false">Find a number</button>
      </div>
      <form id="form" class="ask" role="search" autocomplete="off">
        <label for="q" class="sr" id="q-label">Claim to check</label>
        <input id="q" name="q" type="text" maxlength="1000" spellcheck="false"
          placeholder="Unemployment in Texas was 4.1% in 2023">
        <button id="go" type="submit" aria-label="Check">
          <span>Search</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </div>
  </section>
  <main class="main">
    <div id="out" class="out" aria-live="polite"></div>
  </main>
  <footer class="foot">Independent fact checker · Not a government website</footer>
  <script src="/static/result-view.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
