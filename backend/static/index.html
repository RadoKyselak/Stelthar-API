<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mirador</title>
  <meta name="description" content="Check a number against official U.S. government data, with the exact source.">
  <link rel="icon" href="/static/favicon.png" type="image/png">
  <link rel="preload" href="/static/instrument-serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="/" aria-label="Mirador home">
      <img src="/static/logo.png" alt="" width="28" height="28">
      <span>Mirador</span>
    </a>
  </header>

  <main class="main">
    <h1>Is that number right?</h1>
    <form id="form" class="ask" role="search" autocomplete="off">
      <label for="q" class="sr">A claim to check, or a figure to find</label>
      <input id="q" name="q" type="text" maxlength="1000" spellcheck="false"
        placeholder="Unemployment in Texas was 4.1% in 2023">
      <button id="go" type="submit" aria-label="Look up">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div id="out" class="out" aria-live="polite"></div>
  </main>

  <footer class="foot">Independent · Not a government website</footer>

  <script src="/static/result-view.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
